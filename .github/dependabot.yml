version: 2
updates:
  # - package-ecosystem: "devcontainers"
  #   directory: "/"
  #   target-branch: "dev"
  #   schedule:
  #     interval: weekly
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    groups:
      astro:
        patterns: ["@astrojs/*", "astro*"]
      eslint:
        patterns: ["*eslint*"]
      prettier:
        patterns: ["@trivago/prettier-plugin-sort-imports", "prettier*"]
      radix:
        patterns: ["@radix-ui/*", "radix-ui"]
      react:
        patterns: ["react*"]
      sentry:
        patterns: ["@sentry/*"]
      tailwind:
        patterns: ["@tailwindcss/*", "tailwindcss"]
      types:
        patterns: ["@types/*", "globals"]
      vitest:
        patterns: ["@vitest/*", "vitest*"]
