name: Run tests

on:
  pull_request:
    paths-ignore:
      - ".devcontainer/**"
      - ".vscode/**"
  push:
    branches: [dev, main]

# Ensure existing in-progress jobs on the same branch are cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: true
  FORCE_COLOR: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.CONTENT_REPO_PAT }}
      - name: Create .env file
        run: cp .env.test .env
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          cache: "npm"
          cache-dependency-path: "package-lock.json"
          node-version-file: ".node-version"
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run lint:types -- --mode test
      - name: Lint source code
        run: npm run lint:issues
      - name: Check formatting
        run: npm run lint:style
      - name: Run unit/integration tests
        run: npm run test:unit
      - name: Build the application
        run: npm run build -- --mode test
      - name: Install browsers for e2e tests
        run: npx playwright install --with-deps
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Upload e2e test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
